<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#4FC3F7">
  <title>润衣冒险岛</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --sky:#4FC3F7;        /* 主色 天蓝 */
  --sky-light:#B3E5FC;  /* 浅蓝 */
  --sky-deep:#0288D1;   /* 深蓝 */
  --sky-dark:#01579B;
  --sand:#FFE9B8;
  --sun:#FFD54F;
  --ink:#0B3A5B;
  --ink-soft:#4A7A9B;
  --card:#FFFFFF;
  --cn:#FFB347;   /* 语文 */
  --ma:#4ECDC4;   /* 数学 */
  --en:#FF6B9D;   /* 英语 */
  --ot:#A78BFA;   /* 其他 */
  --ok:#3BC47A;
  --r:28px;
  --shadow:0 6px 0 rgba(2,136,209,.18), 0 10px 24px rgba(2,136,209,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
  color:var(--ink);
  background:linear-gradient(180deg,#8ED8FB 0%,#B3E5FC 32%,#DFF4FE 62%,#FFF4DA 100%);
  background-attachment:fixed;
  min-height:100vh;
  overflow-x:hidden;
  font-size:17px;
  line-height:1.5;
  padding-bottom:110px;
}
/* ---------- 冒险岛装饰层 ---------- */
.scene{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.sun{position:absolute;top:14px;right:22px;width:78px;height:78px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#FFF3B0,#FFD54F 60%,#FFB300);
  box-shadow:0 0 46px 16px rgba(255,213,79,.5);animation:sunPulse 5s ease-in-out infinite}
@keyframes sunPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.cloud{position:absolute;background:#fff;border-radius:50%;opacity:.85;filter:blur(.3px)}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.c1{width:74px;height:34px;top:70px;left:-120px;animation:drift 46s linear infinite}
.c1:before{width:44px;height:44px;top:-20px;left:12px}
.c1:after{width:30px;height:30px;top:-12px;left:42px}
.c2{width:56px;height:26px;top:170px;left:-120px;animation:drift 68s linear infinite 6s}
.c2:before{width:34px;height:34px;top:-15px;left:8px}
.c2:after{width:24px;height:24px;top:-9px;left:32px}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(115vw)}}
.isle{position:absolute;bottom:0;border-radius:50% 50% 0 0 / 70% 70% 0 0;background:var(--sand)}
.isle:after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:100%;width:0;height:0;
  border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:26px solid #7BC96F}
.isle i{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% - 22px);width:3px;height:22px;background:#8B5E3C}
.i1{width:200px;height:66px;left:-40px;opacity:.75}
.i2{width:150px;height:52px;right:-30px;opacity:.6}
.penguin{position:absolute;left:54%;transform:translateX(-50%);bottom:calc(100% - 12px);font-size:30px;
  animation:pg 1.8s ease-in-out infinite;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
@keyframes pg{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-4px)}}
.waves{position:absolute;bottom:0;left:0;right:0;height:70px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.5) 0 30px,transparent 30px 76px);
  mask-image:linear-gradient(180deg,transparent,#000 60%);animation:waveMove 7s linear infinite reverse;opacity:.7}
@keyframes waveMove{from{background-position-x:0}to{background-position-x:106px}}
.boat{position:absolute;bottom:26px;left:-140px;font-size:34px;animation:sail 34s linear infinite;filter:drop-shadow(0 4px 4px rgba(2,136,209,.25))}
@keyframes sail{from{transform:translateX(0) rotate(-2deg)}50%{transform:translateX(55vw) rotate(2deg)}to{transform:translateX(115vw) rotate(-2deg)}}
.twinkle{position:absolute;font-size:15px;animation:tw 2.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.82)}50%{opacity:1;transform:scale(1.14)}}

/* ---------- 布局 ---------- */
.wrap{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:14px 14px 0}
.topbar{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.logo{font-size:27px;letter-spacing:.5px;font-weight:800;color:#fff;
  text-shadow:0 2px 0 var(--sky-deep),0 4px 10px rgba(1,87,155,.35);flex:1;min-width:0}
.logo small{display:block;font-size:12.5px;font-weight:600;letter-spacing:2px;opacity:.92;text-shadow:0 1px 0 var(--sky-deep)}
.starbox{display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:7px 15px 7px 10px;
  box-shadow:var(--shadow);font-weight:800;color:var(--sky-deep);font-size:19px;flex:0 0 auto}
.starbox .ic{font-size:22px;animation:tw 2.2s ease-in-out infinite}
.sync-dot{flex:0 0 auto;font-size:13px;margin-left:3px;line-height:1;user-select:none}
.sync-dot.syncing{animation:dotPulse 1s ease-in-out infinite}
@keyframes dotPulse{0%,100%{opacity:1}50%{opacity:.35}}
.iconbtn{width:50px;height:50px;border-radius:50%;border:none;background:#fff;box-shadow:var(--shadow);
  font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto;transition:transform .12s}
.iconbtn:active{transform:scale(.9)}

/* 欢迎横幅 */
.banner{background:linear-gradient(135deg,#4FC3F7,#29B6F6 55%,#0288D1);color:#fff;border-radius:var(--r);
  padding:16px 18px;box-shadow:var(--shadow);margin-bottom:12px;position:relative;overflow:hidden}
.banner:after{content:"⛵";position:absolute;right:-6px;bottom:-12px;font-size:76px;opacity:.28;transform:rotate(-8deg)}
.banner h1{margin:0 0 4px;font-size:22px;font-weight:800;position:relative}
.banner p{margin:0;font-size:14.5px;opacity:.95;position:relative}
.banner .gateskip-tip{margin:7px 0 0;font-size:13.5px;font-weight:700;color:#FFE3C2;background:rgba(255,255,255,.16);border-radius:999px;padding:4px 12px;display:inline-block;backdrop-filter:blur(2px)}
.progressline{height:12px;background:rgba(255,255,255,.35);border-radius:99px;margin-top:12px;overflow:hidden;position:relative}
.progressline i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#FFF176,#FFD54F);transition:width .5s cubic-bezier(.34,1.56,.64,1)}
.bantitle{margin-top:8px;font-size:14.5px;background:rgba(255,255,255,.78);color:#5D4037;border-radius:14px;padding:7px 12px;display:inline-block;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.bantitle b{color:#C77700;font-size:16px}

/* 今日小队长勋章 */
.medal{margin-bottom:12px;border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:13px;
  background:linear-gradient(135deg,#FFE082,#FFD54F 60%,#FFB300);box-shadow:0 6px 0 rgba(255,160,0,.3),0 12px 22px rgba(255,179,0,.32);
  animation:medalIn .6s cubic-bezier(.34,1.56,.64,1);position:relative;overflow:hidden}
@keyframes medalIn{from{transform:scale(.7) translateY(-14px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.medal .ring{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFFDE7,#FFC107 65%,#FF8F00);
  display:flex;align-items:center;justify-content:center;font-size:32px;flex:0 0 auto;
  box-shadow:0 0 0 4px rgba(255,255,255,.6),0 0 22px 6px rgba(255,193,7,.75);animation:spinPop 2.6s ease-in-out infinite}
@keyframes spinPop{0%,100%{transform:rotate(-6deg) scale(1)}50%{transform:rotate(6deg) scale(1.09)}}
.medal b{display:block;font-size:18px;color:#7A4B00}
.medal span{font-size:13.5px;color:#8D5A00;font-weight:600}
.medal .rays{position:absolute;inset:0;background:conic-gradient(from 0deg,rgba(255,255,255,.35) 0 6deg,transparent 6deg 30deg);
  animation:rays 9s linear infinite;opacity:.5}
@keyframes rays{to{transform:rotate(360deg)}}

/* ---------- 视图切换 ---------- */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:rgba(255,255,255,.65);padding:7px;border-radius:22px;margin-bottom:14px;
  backdrop-filter:blur(6px);box-shadow:0 3px 12px rgba(2,136,209,.13)}
.tab{border:none;background:transparent;border-radius:17px;padding:12px 4px;font-size:16px;font-weight:800;color:var(--sky-deep);
  cursor:pointer;font-family:inherit;transition:.18s;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab .em{font-size:20px}
.tab.on{background:#fff;box-shadow:0 3px 10px rgba(2,136,209,.2);transform:translateY(-1px)}

/* ---------- 卡片 ---------- */
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 4px 0 rgba(2,136,209,.1),0 10px 22px rgba(2,136,209,.12);margin-bottom:14px}
.sec-title{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800;color:var(--sky-deep);margin:2px 0 12px}
.sec-title .n{background:var(--sky-light);color:var(--sky-deep);border-radius:99px;padding:2px 11px;font-size:13.5px}
.hint{font-size:13.5px;color:var(--ink-soft);line-height:1.55}

/* ---------- 任务卡 ---------- */
.tlist{display:flex;flex-direction:column;gap:12px}
.task{position:relative;border-radius:24px;padding:14px;overflow:hidden;
  border:3px solid #EAF6FE;background:#FBFEFF;transition:.22s}
.task .bar{position:absolute;left:0;top:0;bottom:0;width:9px;z-index:1}
.task .t-head{display:flex;align-items:center;gap:12px}
.task .emo{width:58px;height:58px;border-radius:19px;display:flex;align-items:center;justify-content:center;font-size:31px;flex:0 0 auto}
.task .nm{font-size:20px;font-weight:800;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task .nm .txt{position:relative;display:inline-block}
.task .meta{font-size:13px;color:var(--ink-soft);display:flex;gap:7px;flex-wrap:wrap;font-weight:600;margin-top:9px}
.task .t-btns{display:flex;gap:9px;justify-content:flex-end;margin-top:11px}
.task .t-edit{display:flex;gap:8px;justify-content:flex-end;margin-top:9px}
/* 生活页紧凑模式 */
.task.life-card{padding:9px 12px;border-radius:18px;gap:0}
.task.life-card .bar{width:7px}
.task.life-card .t-head{gap:9px}
.task.life-card .emo{width:42px;height:42px;font-size:23px;border-radius:14px}
.task.life-card .nm{font-size:18px}
.task.life-card .meta{margin-top:5px;gap:5px;font-size:12px}
.task.life-card .t-btns{margin-top:7px;gap:7px}
.task.life-card .big{min-width:60px;min-height:46px;border-radius:14px}
.task.life-card .big .e{font-size:21px}
.task.life-card .big .t{font-size:14px}
.task.life-card .btn-half{min-width:54px}
.task.life-card .t-edit{margin-top:5px;gap:6px}
.task.life-card .rbtn{width:34px;height:34px;border-radius:11px;font-size:15px}
.chip{background:#EAF6FE;border-radius:99px;padding:2px 9px;font-size:15px;color:var(--sky-deep);white-space:nowrap}
.chip.skip{background:#FFF1E0;color:#C77700}
.chip.done{background:#E3F9EC;color:#1E9A57}
.done .txt{text-decoration:line-through;text-decoration-color:var(--ok);text-decoration-thickness:3px;color:#7FA9BF}
.done{border-color:var(--ok)!important;background:#F3FDF7!important;opacity:.9}
.done .emo{filter:saturate(.55)}

/* 大按钮 */
.btns{display:flex;gap:9px;flex:0 0 auto;align-items:center}
.big{min-width:70px;min-height:64px;border-radius:20px;border:none;font-family:inherit;font-weight:800;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;transition:transform .12s;color:#fff;gap:1px}
.big:active{transform:scale(.93)}
.big .e{font-size:26px}
.big .t{font-size:14px}
.btn-full{background:linear-gradient(135deg,#66D9A0,#22B36B);box-shadow:0 4px 0 #178A50}
.btn-half{background:linear-gradient(135deg,#FFD97D,#FFB300);box-shadow:0 4px 0 #C98A00;min-width:58px}
.btn-skip{background:#fff;color:#C77700;border:2.5px solid #FFD9A8;box-shadow:0 4px 0 #FFE9CC;min-width:58px;min-height:64px;font-size:14px;font-weight:800;
  font-family:inherit;border-radius:20px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.btn-skip:active{transform:scale(.93)}
.btn-minus{background:linear-gradient(135deg,#FF8A65,#E5533C);box-shadow:0 4px 0 #C0392B;min-width:70px;min-height:64px;border-radius:20px;border:none;font-family:inherit;font-weight:800;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#fff;transition:transform .12s}
.btn-minus:active{transform:scale(.93)}
.btn-done-note{background:#E3F9EC;color:#1E9A57;border:none;border-radius:20px;min-height:64px;min-width:70px;font-weight:800;font-size:13px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:inherit;cursor:pointer}
.rbtn{width:40px;height:40px;border-radius:13px;border:none;background:#F0F8FD;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.rbtn:active{transform:scale(.9)}
details.daygrp{border:2px solid #EAF6FE;border-radius:16px;padding:8px 12px;margin-top:10px;background:#FBFEFF}
details.daygrp summary{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:800;list-style:none;padding:2px 0}
details.daygrp summary::-webkit-details-marker{display:none}
details.daygrp .dg-arrow{transition:transform .2s;font-size:12px;color:var(--ink-soft)}
details.daygrp[open] .dg-arrow{transform:rotate(90deg)}
details.daygrp .dg-d{font-size:15px;color:var(--ink)}
details.daygrp .dg-c{color:var(--ink-soft);font-size:13px;font-weight:700}
details.daygrp .dg-s{margin-left:auto;color:#C77700;font-weight:800}

/* 已完成长条 */
.streakbar{display:flex;align-items:center;gap:9px;background:linear-gradient(90deg,#E3F9EC,#F3FDF7);border-radius:20px;padding:13px 15px;font-weight:800;color:#1E9A57;font-size:15.5px}

/* 休息 */
.rest{text-align:center;padding:26px 14px;border-radius:24px;background:linear-gradient(180deg,#EAF6FE,#fff);border:3px dashed var(--sky-light)}
.rest .e{font-size:46px;display:block;margin-bottom:6px;animation:tw 3s ease-in-out infinite}
.rest b{font-size:17px;color:var(--sky-deep)}

/* ---------- 周视图 ---------- */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}
.day{border-radius:20px;padding:9px 6px;background:#F7FCFF;border:2.5px solid #EAF6FE;min-height:150px;display:flex;flex-direction:column;gap:6px}
.day.today{border-color:var(--sky);background:#F0FAFF;box-shadow:0 0 0 4px rgba(79,195,247,.2)}
.day.past{opacity:.55}
.day .dh{text-align:center;font-weight:800;font-size:13px;color:var(--sky-deep);padding-bottom:5px;border-bottom:2px dotted var(--sky-light)}
.day .item{border-radius:12px;padding:6px 5px;font-size:11.5px;font-weight:700;color:#fff;text-align:center;line-height:1.25;overflow:hidden;position:relative}
.day .item .ie{font-size:15px;display:block}
.day .item.okm:after{content:"✓";position:absolute;top:2px;right:4px;font-size:12px}
.day .item.dim{opacity:.42}
.day .item.skipm{opacity:.5;text-decoration:line-through}
.day .moon{flex:1;display:flex;align-items:center;justify-content:center;font-size:24px;opacity:.8}
.day .tick{font-size:11px;text-align:center;color:var(--ink-soft);font-weight:700}

/* ---------- 星星统计 ---------- */
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.metric{border-radius:20px;padding:14px 12px;text-align:center;background:linear-gradient(180deg,#EAF6FE,#F8FDFF);border:2.5px solid #E1F2FC}
.metric .lb{font-size:12.5px;color:var(--ink-soft);font-weight:700;margin-bottom:4px}
.metric .vl{font-size:26px;font-weight:800;color:var(--sky-deep);line-height:1.1}
.metric .un{font-size:12px;color:var(--ink-soft);font-weight:700}
.bars{display:flex;flex-direction:column;gap:11px}
.barrow{background:#F7FCFF;border-radius:18px;padding:11px 13px;border:2px solid #EAF6FE}
.barrow .top{display:flex;align-items:center;gap:7px;font-size:14.5px;font-weight:800;margin-bottom:7px}
.barrow .top .sp{flex:1}
.barrow .top .cnt{font-size:13px;color:var(--ink-soft);font-weight:700}
.track{height:15px;border-radius:99px;background:#E7F4FB;overflow:hidden;position:relative}
.track i{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.34,1.56,.64,1)}
.track .target{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--sky-deep);border-radius:2px;opacity:.55}

/* 小报告 */
.report{border-radius:22px;padding:15px;background:linear-gradient(180deg,#FFF8E1,#FFFDF5);border:2.5px solid #FFE9A8}
.report h3{margin:0 0 8px;font-size:16.5px;color:#B07B00;display:flex;align-items:center;gap:7px}
.report .row{font-size:14px;color:#7A5A10;font-weight:600;margin-bottom:5px;display:flex;gap:7px;align-items:flex-start}
.report .row .k{flex:0 0 auto}
.report .best{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.report .best .b{background:#fff;border-radius:99px;padding:4px 11px;font-size:13px;font-weight:800;color:#B07B00;border:1.5px solid #FFE9A8}

/* ---------- 兑换 ---------- */
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px}
.prize{border-radius:22px;padding:13px;border:2.5px solid #EAF6FE;background:#FBFEFF;text-align:center;position:relative;display:flex;flex-direction:column;align-items:center;gap:7px}
.prize .pe{font-size:36px;line-height:1}
.prize .pn{font-size:15.5px;font-weight:800}
.prize .pc{font-size:14px;font-weight:800;color:#C77700;background:#FFF3D6;border-radius:99px;padding:3px 12px}
.prize .pbtn{border:none;border-radius:16px;padding:12px 10px;min-height:52px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;
  width:100%;color:#fff;background:linear-gradient(135deg,#66D9A0,#22B36B);box-shadow:0 4px 0 #178A50;transition:transform .12s}
.prize .pbtn:active{transform:scale(.95)}
.prize .pbtn.no{background:#EDF3F6;color:#9DB6C4;box-shadow:0 4px 0 #DCE8EE}
.prize.dis{border-color:#FFE9A8;background:#FFFDF5}
.prize .tools{position:absolute;top:6px;right:6px;display:flex;gap:3px}
.prize .tools button{width:28px;height:28px;border-radius:9px;border:none;background:#F0F8FD;font-size:13px;cursor:pointer}
.warnbar{background:#FFF3D6;border-radius:16px;padding:11px 14px;font-size:13.5px;font-weight:700;color:#A87200;margin-bottom:12px;display:flex;gap:8px;align-items:center}

/* ---------- 通用按钮/表单 ---------- */
.btn{min-height:60px;border-radius:20px;border:none;font-family:inherit;font-weight:800;font-size:17px;cursor:pointer;
  padding:0 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s;color:#fff;
  background:linear-gradient(135deg,#4FC3F7,#0288D1);box-shadow:0 4px 0 #01649C}
.btn:active{transform:scale(.96)}
.btn.ghost{background:#fff;color:var(--sky-deep);border:2.5px solid var(--sky-light);box-shadow:0 4px 0 #E1F2FC}
.btn[disabled]{background:linear-gradient(135deg,#BFD9E6,#9FBCCB);box-shadow:0 5px 0 #8AA8B8;cursor:not-allowed;opacity:.8}
.btn.wide{width:100%}
.btn.sm{min-height:48px;font-size:15px;padding:0 15px;border-radius:16px}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap}
.field{margin-bottom:13px}
.field label{display:block;font-size:14.5px;font-weight:800;color:var(--ink);margin-bottom:6px}
input[type=text],input[type=number],select{width:100%;min-height:56px;border-radius:17px;border:2.5px solid #E1F2FC;background:#FBFEFF;
  padding:0 15px;font-size:17px;font-family:inherit;font-weight:600;color:var(--ink);outline:none}
input:focus,select:focus{border-color:var(--sky);background:#fff}
.segs{display:flex;gap:8px;flex-wrap:wrap}
.seg{flex:1;min-width:76px;min-height:58px;border-radius:17px;border:2.5px solid #E1F2FC;background:#FBFEFF;font-family:inherit;font-weight:800;
  font-size:16px;cursor:pointer;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;gap:5px;padding:0 8px}
.seg.on{color:#fff;border-color:transparent}
.weekpick{display:flex;gap:7px}

<script>
"use strict";
/* ==================== 工具 ==================== */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const WD=["周一","周二","周三","周四","周五","周六","周日"];
const WD_EM=["",  "🌤️","🌤️","🌤️","🌤️","🌈","🏖️"];
const SUB={chinese:{n:"语文",c:"#FFB347",e:"📖"},math:{n:"数学",c:"#4ECDC4",e:"🔢"},english:{n:"英语",c:"#FF6B9D",e:"🔤"},other:{n:"其他",c:"#A78BFA",e:"🎨"}};
const EPS=1e-6;
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);}
function todayStr(){const d=new Date();return fmt(d);}
function fmt(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0");return y+"-"+m+"-"+dd;}
function parseD(s){const p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return fmt(d);}
function dowMon(s){const d=parseD(s).getDay();return d===0?7:d;} /* 1..7 周一..周日 */
function weekOf(s){return addDays(s,-(dowMon(s)-1));} /* 该周周一 */
function nStars(v){return Math.round(v*2)/2;}
function starTxt(v){return nStars(v)%1===0?String(Math.round(v)):v.toFixed(1);}
function h(t,c){const d=document.createElement("div");d.className="hint";return d;} 
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

/* ==================== 数据 ==================== */
const LS="ruyi_island_v1";
const DEFAULT_TASKS=[
  {id:"t_pinyin",  name:"拼音拼读",   sub:"chinese", u:"day", days:[1,2,3,4,5,6,7], dur:10, weeklyNeed:7, icon:"🅰️"},
  {id:"t_read",    name:"语文阅读",   sub:"chinese", u:"day", days:[1,2,3,4,5,6,7], dur:15, weeklyNeed:7, icon:"📚"},
  {id:"t_sport",   name:"运动打卡",     sub:"other",   u:"day", days:[1,2,3,4,5,6,7], dur:20, weeklyNeed:7, icon:"🏃"},
  {id:"t_english", name:"英语",       sub:"english", u:"week",days:[1,3,5],         dur:15, weeklyNeed:3, icon:"🔤"},
  {id:"t_grid",    name:"舒尔特方格", sub:"math",    u:"week",days:[2,4],           dur:5,  weeklyNeed:2, icon:"🔢"},
  {id:"t_draw",    name:"画画",       sub:"other",   u:"week",days:[6],             dur:30, weeklyNeed:1, icon:"🎨"},
  {id:"t_poem",    name:"古诗",       sub:"chinese", u:"week",days:[7],             dur:20, weeklyNeed:1, icon:"🀄"},
  {id:"t_bible",   name:"读经祷告",     sub:"other",   u:"day", days:[1,2,3,4,5,6,7], dur:10, weeklyNeed:7, icon:"🙏", star:1}
];
const DEFAULT_PRIZES=[
  {id:"p1",name:"一颗糖果", icon:"🍬", cost:3},
  {id:"p2",name:"一小包饼干",icon:"🍪", cost:5},
  {id:"p3",name:"奶茶",     icon:"🧋", cost:12},
  {id:"p4",name:"一包薯片", icon:"🍟", cost:10},
  {id:"p5",name:"一瓶酸奶", icon:"🥛", cost:6},
  {id:"p6",name:"肯德基",   icon:"🍗", cost:20},
  {id:"p7",name:"火锅",     icon:"🍲", cost:35},
  {id:"p8",name:"5块钱",    icon:"💰", cost:10},
  {id:"p9",name:"小蛋糕",   icon:"🍰", cost:12}
];
function blankDB(){
  return {
    v:1,
    profile:{child:"润衣", welcome:"欢迎来到润衣冒险岛！", needFn:null, needMin:0},
    tasks:JSON.parse(JSON.stringify(DEFAULT_TASKS)),
    prizes:JSON.parse(JSON.stringify(DEFAULT_PRIZES)),
    logs:{},       /* "t_xxx|2026-10-14": 1 或 0.5 */
    skips:{},      /* "t_xxx|2026-10-14": true  (今天跳过) */
    redeemed:[],   /* {id,prizeId,name,icon,cost,date} */
    extra:[],      /* {id,date,txt,val} 自定义加星（补任务、生活习惯奖励、初始奖励等） */
    stars:{earned:60, spent:0},
    streaks:{full:0,lastFullDay:null,bestFull:0},
    awards:{},     /* "bonus:date:kind": true */
    seenReport:{}, /* 已看过周报：周一起始日 */
    dailyDate:null,
    bonus:{},          /* "2026-10-14": true 每日全做完奖励已领 */
    gatePass:{},       /* "2026-10-14": {bonus:true} 当天已通过进岛门槛并已发星 */
    life:{
      items:[
        {id:"lb_toy",      name:"收拾玩具",            icon:"🧸", kind:"bonus", star:1},
        {id:"lb_teeth",    name:"早晚刷牙",            icon:"🪥", kind:"bonus", brush:true, star:0.5},
        {id:"lb_bag",      name:"自己整理书包",         icon:"🎒", kind:"bonus", star:1, brush:false},
        {id:"lb_proactive",name:"妈妈回家前主动完成任务", icon:"🏠", kind:"bonus", star:1},
        {id:"lb_skill",    name:"每天学习一个新技能",    icon:"💡", kind:"bonus", star:1},
        {id:"ld_toilet",   name:"上厕所不抽马桶",       icon:"🚽", kind:"deduct"},
        {id:"ld_barefoot", name:"光脚脚踩地",          icon:"🦶", kind:"deduct"},
        {id:"ld_meal",     name:"不吃正餐",            icon:"🍚", kind:"deduct"}
      ],
      log:[]
    }
  };
}
let DB=null;
function load(){
  try{
    const raw=localStorage.getItem(LS);
    if(!raw){
      /* 首次加载：从零起步，走 migrateDB 重建 10/14 的历史 */
      const b=blankDB();
      migrateDB(b);
      return b;
    }
    const d=JSON.parse(raw);
    const b=blankDB();
    /* 兼容合并 */
    const out=Object.assign(b,d);
    out.profile=Object.assign(b.profile,d.profile||{});
    out.stars=Object.assign(b.stars,d.stars||{});
    out.streaks=Object.assign(b.streaks,d.streaks||{});
    out.awards=d.awards||{}; out.seenReport=d.seenReport||{};
    out.tasks=Array.isArray(d.tasks)&&d.tasks.length?d.tasks:b.tasks;
    out.prizes=Array.isArray(d.prizes)?d.prizes:b.prizes;
    out.logs=d.logs||{}; out.skips=d.skips||{}; out.redeemed=d.redeemed||[];
    out.extra=Array.isArray(d.extra)?d.extra:[];
    out.bonus=d.bonus||{};
    out.gatePass=(d.gatePass&&typeof d.gatePass==="object")?d.gatePass:{};
    out.life=(d.life&&Array.isArray(d.life.items))?d.life:JSON.parse(JSON.stringify(b.life));
    out.life.log=Array.isArray(out.life.log)?out.life.log:[];
    migrateDB(out);
    return out;
  }catch(e){return blankDB();}
}
/* save() 已迁移至 Supabase 云端同步层（见上方 syncAll / function save） */
/* ==================== 数据迁移（让已有数据也同步最新结构） ==================== */
function migrateDB(d){
  if(!d||!Array.isArray(d.tasks))return;
  /* 跳绳 / 篮球 → 运动打卡 */
  const sport=d.tasks.find(t=>t.id==="t_sport");
  if(sport){sport.name="运动打卡";sport.icon="🏃";}
  /* 妈妈回家前主动完成任务 / 每天学习一个新技能 移出任务、纳入生活好习惯 */
  d.tasks=d.tasks.filter(t=>t.id!=="t_proactive"&&t.id!=="t_skill");
  /* 每日新增：读经祷告 */
  if(!d.tasks.find(t=>t.id==="t_bible")){
    d.tasks.push({id:"t_bible",name:"读经祷告",sub:"other",u:"day",days:[1,2,3,4,5,6,7],dur:10,weeklyNeed:7,icon:"🙏",star:1});
  }
  /* 生活好习惯补齐 */
  d.life=d.life||{items:[],log:[]};
  d.life.items=d.life.items||[];
  d.life.log=d.life.log||[];
  const has=id=>d.life.items.find(i=>i.id===id);
  const add=it=>{if(!has(it.id))d.life.items.push(it);};
  add({id:"lb_toy",name:"收拾玩具",icon:"🧸",kind:"bonus",star:1});
  add({id:"lb_bag",name:"自己整理书包",icon:"🎒",kind:"bonus",star:1,brush:false});
  add({id:"lb_proactive",name:"妈妈回家前主动完成任务",icon:"🏠",kind:"bonus",star:1});
  add({id:"lb_skill",name:"每天学习一个新技能",icon:"💡",kind:"bonus",star:1});
  const teeth=has("lb_teeth");
  if(teeth){teeth.brush=true;teeth.star=0.5;teeth.name="早晚刷牙";}
  else add({id:"lb_teeth",name:"早晚刷牙",icon:"🪥",kind:"bonus",brush:true,star:0.5});

let VIEW="today";

/* ==================== 核心逻辑 ==================== */
function taskById(id){return DB.tasks.find(t=>t.id===id)||null;}
function planOn(t,ds){return (t.days||[]).indexOf(dowMon(ds))>=0;}
function key(id,ds){return id+"|"+ds;}
function doneVal(id,ds){const v=DB.logs[key(id,ds)];return typeof v==="number"?v:0;}
function isSkipped(id,ds){return !!DB.skips[key(id,ds)];}

/* 某任务在某周（以周一 ws 起）已完成次数 */
function doneCountInWeek(t,ws){
  let c=0;
  for(let i=0;i<7;i++){
    const ds=addDays(ws,i);
    const v=doneVal(t.id,ds);
    if(v>0) c+= v>=0.999?1:0.5;
  }
  return c;
}
/* 本周目标次数 */
function weeklyNeed(t){return Math.max(0, t.u==="day"?7:(t.weeklyNeed||0));}
/* 本周是否已达成 → 提前完成自动放假 */
function weekCleared(t,ws){const n=weeklyNeed(t);return n>0 && t.u==="week" && doneCountInWeek(t,ws)>=n-EPS;}
/* 今天是否还要显示这个任务 */
function activeToday(t,ds){
  if(!planOn(t,ds)) return false;
  if(isSkipped(t.id,ds)) return false;
  const v=doneVal(t.id,ds);
  if(v>=0.999) return false;               /* 已完成 */
  if(weekCleared(t,weekOf(ds))) return false; /* 提前完成，放假 */
  return true;
}
/* 今日任务列表（含已完成，用于展示） */
function todayList(ds){
  return DB.tasks.filter(t=>planOn(t,ds) && !(t.u==="week" && weekCleared(t,weekOf(ds)) && doneVal(t.id,ds)<=0));
}
/* 今日待办（真正还没做的，已完成/半颗星/跳过/本周做满都不算） */
function todayPending(ds){
  return todayList(ds).filter(t=>{
    if(isSkipped(t.id,ds)) return false;
    if(doneVal(t.id,ds)>0) return false;
    if(weekCleared(t,weekOf(ds))) return false;
    return true;
  });
}
/* 今日已完成（整颗星） */
function todayDone(ds){
  return todayList(ds).filter(t=>doneVal(t.id,ds)>=0.999);
}
function todayAllDone(ds){
  if(!planOn0(ds)) return false;
  const l=todayList(ds);
  return l.length>0 && l.every(t=>doneVal(t.id,ds)>=0.999);
}
/* 这一天是否本来就安排了任务 */
function planOn0(ds){
  return DB.tasks.some(t=>planOn(t,ds) && !(t.u==="week" && weekCleared(t,weekOf(ds)) && doneVal(t.id,ds)<=0));
}

function checkIn(id,ds,val){
  const t=taskById(id);if(!t)return;
  const prev=doneVal(id,ds);
  const st=(t.star||1);
  DB.logs[key(id,ds)]=val;
  DB.stars.earned=nStars(DB.stars.earned + (val-prev)*st);
  delete DB.skips[key(id,ds)];
  save();
  const got=nStars((val-prev)*st);
  fx.checkIn(id,got);
  if(val>=0.999){
    const praise=["{name}真棒！","今天又进步了！","坚持就是胜利！","太厉害了，给你点赞！","小船员真给力！","冒险进度+1！"];

  }
  checkStreakBonus(ds);
  checkFullDay(ds);
  render();
  if(typeof window.__afterCheck==="function") window.__afterCheck();
}

  const prev=doneVal(id,ds);
  if(prev<=0)return;
  const t=taskById(id), st=(t&&t.star)||1;
  delete DB.logs[key(id,ds)];
  DB.stars.earned=nStars(Math.max(0,DB.stars.earned-prev*st));

/* 连续打卡奖励 */
function checkStreakBonus(ds){
  const d0=new Date();d0.setHours(0,0,0,0);
  let real=false;
  for(let i=0;i<2;i++){
    const d=new Date(d0.getTime());d.setDate(d.getDate()-i);
    if(fmt(d)===ds){real=true;break;}
  }
  if(!real)return;
  const dayStreak=todayAllDone(ds) ? computeDoneStreak() : 0;
  [[3,2,"连续3天打卡"],[7,5,"连续7天打卡"]].forEach(function(p){
    if(dayStreak>=p[0]){
      const k="streak:"+ds+":"+p[0];

        },520);

/* 连续全勤天数（从今天/昨天往前数） */
function computeDoneStreak(){
  let n=0,cursor=todayStr();
  if(!todayAllDone(cursor)) cursor=addDays(cursor,-1);
  let guard=0;
  while(guard++<400){
    if(todayAllDone(cursor)){n++;cursor=addDays(cursor,-1);}
    else break;
  }
  return n;
}
/* 全勤记录 + 称号升级 */
function checkFullDay(ds){
  if(!todayAllDone(ds)) return;
  const st=DB.streaks;
  if(st.lastFullDay!==ds){
    st.full=(st.lastFullDay && st.lastFullDay===addDays(ds,-1)) ? (st.full||0)+1 : 1;
    st.lastFullDay=ds;
    st.best=Math.max(st.best||0,st.full);
    save();
    const bonus=2;
    const k="full:"+ds;
    if(!DB.awards[k]){
      DB.awards[k]=true;
      DB.stars.earned=nStars(DB.stars.earned+bonus);

      },760);
    }
  }
}

    /* 顶部星星跳动 */
    if(target){target.animate([{transform:"scale(1)"},{transform:"scale(1.45)"},{transform:"scale(1)"}],{duration:520,easing:"ease-out"});}
  },
  confetti(cx,cy,n){
    const colors=["#FFD54F","#4FC3F7","#FF6B9D","#4ECDC4","#A78BFA","#FFB347","#3BC47A"];
    for(let i=0;i<n;i++){
      const c=document.createElement("div");
      c.className="confetti";
      c.style.background=colors[(Math.random()*colors.length)|0];
      if(Math.random()<0.32){c.style.borderRadius="50%";}
      c.style.left=cx+"px";c.style.top=cy+"px";
      document.getElementById("fx").appendChild(c);
      const ang=Math.random()*Math.PI*2, dist=70+Math.random()*200;
      const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist-70;
      c.animate([
        {transform:"translate(0,0) rotate(0deg) scale(1)",opacity:1},
        {transform:"translate("+dx+"px,"+dy+"px) rotate("+(Math.random()*720-360)+"deg) scale(.9)",opacity:1,offset:.6},
        {transform:"translate("+(dx*1.15)+"px,"+(dy+240)+"px) rotate("+(Math.random()*900-450)+"deg) scale(.5)",opacity:0}
      ],{duration:1400+Math.random()*600,easing:"cubic-bezier(.2,.7,.4,1)"}).onfinish=()=>c.remove();
    }
  },
  pop(title,sub){
    const p=document.createElement("div");
    p.className="pop";
    p.innerHTML='<div style="font-size:19px">'+esc(title)+'</div>'+(sub?'<div style="font-size:13.5px;opacity:.92;margin-top:3px">'+esc(sub)+'</div>':'');
    p.style.left="50%";p.style.top="24%";p.style.transform="translateX(-50%)";
    document.getElementById("fx").appendChild(p);
    p.animate([{transform:"translateX(-50%) scale(.5)",opacity:0},{transform:"translateX(-50%) scale(1.06)",opacity:1,offset:.55},{transform:"translateX(-50%) scale(1)",opacity:1}],{duration:480,easing:"cubic-bezier(.34,1.56,.64,1)"});
    setTimeout(()=>{p.animate([{opacity:1,transform:"translateX(-50%) translateY(0)"},{opacity:0,transform:"translateX(-50%) translateY(-22px)"}],{duration:380}).onfinish=()=>p.remove();},1300);
  }
};
let toastTimer=null;
function toast(msg){
  $$(".toast").forEach(e=>e.remove());
  const d=document.createElement("div");d.className="toast";d.textContent=msg;
  document.body.appendChild(d);
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{d.animate([{opacity:1},{opacity:0}],{duration:300}).onfinish=()=>d.remove();},2100);
}

function taskCardHTML(t,ds,compact){
  const c=SUB[t.sub]||SUB.other;
  const v=doneVal(t.id,ds);
  const done=v>=0.999, half=(v>0&&v<0.999);
  const skip=isSkipped(t.id,ds);
  const ws=weekOf(ds);
  const need=weeklyNeed(t);
  const dc=doneCountInWeek(t,ws);
  const isWeek=t.u==="week";
  const timesToday=Math.max(1,Math.round(7/Math.max(1,(t.days||[]).length)));
  const slots=[];
  for(let i=0;i<timesToday;i++) slots.push(addDays(ws,i*Math.max(1,Math.floor(7/timesToday))));
  let sessionTxt="";
  if(isWeek&&timesToday>1&&!done&&!half){
    const idx=slots.findIndex(s=>s===ds);
    if(idx>=0){
      const before=slots.slice(0,idx).reduce((a,s)=>a+(doneVal(t.id,s)>=0.999?1:0),0);
      sessionTxt=(before+1)+"/"+timesToday;
    }
  }
  let chips='<span class="chip" style="background:'+c.c+'22;color:'+c.c+'">'+c.n+'</span>';
  chips+='<span class="chip">⏱ '+t.dur+'分钟</span>';
  chips+='<span class="chip" style="background:#FFF6DD;color:#C77700">⭐ 完成 +'+starTxt(t.star||1)+'</span>';
  if(isWeek){
    chips+= weekCleared(t,ws)
      ? '<span class="chip done">✅ 本周已做满，放假啦</span>'
      : '<span class="chip">🎯 这周还差'+starTxt(Math.max(0,need-dc))+'次</span>';
  }
  if(sessionTxt) chips+='<span class="chip">第 '+sessionTxt+' 次</span>';
  else if(isWeek) chips+='<span class="chip">'+sessionTxt+ (t.sessionHintTxt||"") +'</span>';
  if(half) chips+='<span class="chip done">🌓 半颗星</span>';
  if(skip) chips+='<span class="chip skip">🌊 今天跳过</span>';

  let btns="";
  if(done){
    btns='<button class="btn-done-note" data-act="undo" data-id="'+t.id+'" title="点一下撤销">✅<span>已完成</span></button>';
  }else{
    btns='<button class="big btn-full" data-act="full" data-id="'+t.id+'"><span class="e">⭐</span><span class="t">打卡</span></button>'+
         '<button class="big btn-half" data-act="half" data-id="'+t.id+'"><span class="e">🌓</span><span class="t">半颗</span></button>'+
         '<button class="btn-skip" data-act="skip" data-id="'+t.id+'"><span style="font-size:19px">🌊</span><span>跳过</span></button>';
  }
  const showEdit=DB.profile.editMode;
  const editRow=showEdit?'<div class="t-edit"><button class="rbtn" data-act="edit" data-id="'+t.id+'" title="编辑">✏️</button><button class="rbtn" data-act="del" data-id="'+t.id+'" title="删除">🗑️</button></div>':'';
  return '<div class="task'+(done?" done":"")+(half?" half":"")+'" data-tid="'+t.id+'">'+
    '<div class="bar" style="background:'+c.c+'"></div>'+
    '<div class="t-head"><div class="emo" style="background:'+c.c+'26">'+ (t.icon||c.e) +'</div>'+
    '<div class="nm"><span class="txt">'+esc(t.name)+'</span></div></div>'+
    '<div class="meta">'+chips+'</div>'+
    editRow+
    '<div class="t-btns">'+btns+'</div></div>';
}

    logRows.push({d:d, txt:"📝 完成学校作业 +"+gateBonus()+"⭐", v:gateBonus(), gate:true});

  (DB.life.log||[]).forEach(function(r){

        const tw=(r.gate||r.extra||r.life)?"800":"700";

        html+='<div class="hint" style="font-size:14px;margin:7px 0 0;display:flex;gap:8px;align-items:center">'+

          '<span style="color:'+vcol+';font-weight:800;flex:0 0 auto">'+sign+starTxt(Math.abs(r.v))+'⭐</span></div>';
      });
      html+='</details>';
    });
    html+='</div>';
  }

  /* 兑换记录 */
  if(DB.redeemed.length){
    html+='<div class="card"><div class="sec-title">🎁 兑换记录<span class="n">'+DB.redeemed.length+' 次</span></div>';
    DB.redeemed.slice().reverse().slice(0,12).forEach(function(r){
      html+='<div class="hint" style="font-size:14.5px;margin-bottom:6px">'+r.icon+' '+esc(r.name)+' <span style="color:#C77700;font-weight:800">-'+starTxt(r.cost)+'⭐</span> <span style="float:right">'+r.date.slice(5)+'</span></div>';
    });
    html+='</div>';
  }
  return html;
}
function reportHTML(ws,ds){
  const wkEnd=addDays(ws,6);
  let gain=0, best=[], details=[];
  Object.keys(DB.logs).forEach(function(k){
    const p=k.split("|");
    if(p[1]>=ws&&p[1]<=wkEnd) gain+=DB.logs[k];
  });
  Object.keys(DB.awards).forEach(function(k){
    const p=k.split(":");
    if(p[0]==="streak"&&p[1]>=ws&&p[1]<=wkEnd) gain+=(p[2]==="3"?2:5);
    if(p[0]==="full"&&p[1]>=ws&&p[1]<=wkEnd) gain+=2;
  });
  const gateDays=gatePassDates(ws,wkEnd);
  gateDays.forEach(function(){ gain+=gateBonus(); });
  (DB.extra||[]).forEach(function(r){ if(r.date>=ws&&r.date<=wkEnd) gain+=r.val; });
  (DB.life.log||[]).forEach(function(r){ if(r.date>=ws&&r.date<=wkEnd) gain+=r.delta; });
  gain=nStars(gain);
  let fullDays=0, totalDays=0;
  for(let i=0;i<7;i++){
    const d=addDays(ws,i);
    if(d>ds) break;
    totalDays++;
    if(todayAllDone(d)||(DB.awards["full:"+d])) fullDays++;
  }
  DB.tasks.forEach(function(t){

  details.filter(d=>d.r>=0.999).slice(0,4).forEach(d=>best.push((d.t.icon||"")+" "+d.t.name));
  const weak=details.filter(d=>d.r<0.6).slice(0,3);
  DB.seenReport[ws]=true;save();
  return '<div class="card report"><h3>📜 本周小报告 <span style="font-size:13px;font-weight:700;color:#B07B00">（'+ws.slice(5)+' ~ '+wkEnd.slice(5)+'）</span></h3>'+

}

function lifeItemById(id){return DB.life.items.find(x=>x.id===id)||null;}
function lifeCount(itemId,ds,sub){return (DB.life.log||[]).filter(r=>r.itemId===itemId&&r.date===ds&&(!sub||r.sub===sub)).length;}
function lifeDaySum(ds){let b=0,d=0;(DB.life.log||[]).forEach(r=>{if(r.date===ds){if(r.kind==="deduct")d+=r.delta;else b+=r.delta;}});return {b:b,d:d};}
function lifeTap(itemId,ds,sub){
  const it=lifeItemById(itemId);if(!it)return;
  if(it.kind==="deduct"){
    if(lifeCount(itemId,ds)>=2){toast("「"+it.name+"」今天已经扣满 2 分啦～");return;}
    const delta=-1;
    DB.life.log.push({id:uid(),itemId,date:ds,kind:"deduct",delta,sub:null,txt:it.icon+" "+it.name+" 扣分 "+starTxt(delta)+"⭐"});
    DB.stars.earned=nStars(DB.stars.earned+delta);
    fx.pop("记下来啦～","已扣 "+starTxt(-lifeDaySum(ds).d)+" 分（当天最多2分）");
  }else if(it.brush){

    DB.stars.earned=nStars(DB.stars.earned+delta);

    fx.pop((sub==="am"?"🌅 早上":"🌙 晚上")+"刷牙 +"+starTxt(delta)+"⭐","真棒！");
  }else{
    if(lifeCount(itemId,ds)>=2){toast("「"+it.name+"」今天已经加满 2 次啦～");return;}
    const delta=nStars(it.star||1);
    DB.life.log.push({id:uid(),itemId,date:ds,kind:"bonus",delta,sub:null,txt:it.icon+" "+it.name+" 好习惯 +"+starTxt(delta)+"⭐"});
    DB.stars.earned=nStars(DB.stars.earned+delta);

}

/* ==================== 数据导入 / 导出 ==================== */
function normalizeDB(d){
  const b=blankDB();
  if(!d||typeof d!=="object")return b;
  const out=Object.assign(b,d);
  out.profile=Object.assign(b.profile,d.profile||{});
  out.stars=Object.assign(b.stars,d.stars||{});
  out.streaks=Object.assign(b.streaks,d.streaks||{});
  out.awards=d.awards||{};out.seenReport=d.seenReport||{};
  out.tasks=Array.isArray(d.tasks)&&d.tasks.length?d.tasks:b.tasks;
  out.prizes=Array.isArray(d.prizes)?d.prizes:b.prizes;
  out.logs=d.logs||{};out.skips=d.skips||{};out.redeemed=Array.isArray(d.redeemed)?d.redeemed:[];
  out.extra=Array.isArray(d.extra)?d.extra:[];
  out.bonus=d.bonus||{};
  out.gatePass=(d.gatePass&&typeof d.gatePass==="object")?d.gatePass:{};
  out.life=(d.life&&Array.isArray(d.life.items))?d.life:JSON.parse(JSON.stringify(b.life));
  out.life.log=Array.isArray(out.life.log)?out.life.log:[];
  migrateDB(out);
  return out;
}
function exportData(){
  try{
    const ds=todayStr();
    const data=JSON.stringify(DB,null,2);
    const filename="润衣冒险岛数据_"+ds+".json";
    /* 方案1：Blob + <a download>（推荐，覆盖大多数浏览器） */
    const blob=new Blob([data],{type:"application/json;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download=filename;
    a.rel="noopener";
    a.style.display="none";
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    },300);
    /* 方案2：兜底 — 同时提供 data URL 文本，方便某些 WebView/微信内直接复制保存 */
    if(navigator.userAgent.match(/MicroMessenger|QQ\//i)){
      const dataUrl="data:application/json;charset=utf-8,"+encodeURIComponent(data);
      const b=document.createElement("a");
      b.href=dataUrl;b.download=filename;b.style.display="none";
      document.body.appendChild(b);b.click();
      setTimeout(function(){document.body.removeChild(b);},300);
      toast("微信内请长按保存或截图 📤");
    }else{
      toast("已导出数据到「下载」文件夹 📤");
    }
  }catch(e){
    console.error(e);
    toast("导出失败："+e.message);
  }
}
function importData(){
  const inp=document.createElement("input");
  inp.type="file";inp.accept="application/json,.json";
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const obj=JSON.parse(rd.result);
        if(!confirm("导入会覆盖当前这台设备上的所有数据，确定继续吗？"))return;
        DB=normalizeDB(obj);save();closeSheet();toast("数据已导入 ✅");render();
      }catch(e){toast("文件格式不对，导入失败");}
    };
    rd.readAsText(f);
  };
  inp.click();
}

function bindView(){
  const v=document.getElementById("view");
  v.onclick=function(e){
    const b=e.target.closest("[data-act]");
    if(!b)return;
    const act=b.dataset.act, id=b.dataset.id;
    if(act==="full"||act==="half"){
      const card=b.closest(".task");
      fx.checkIn(card,act==="half"?1:1);
      checkIn(id,todayStr(),act==="half"?0.5:1);
    }else if(act==="undo"){ undo(id,todayStr()); }
    else if(act==="skip"){ skipTask(id,todayStr()); }
    else if(act==="edit"){ openTaskSheet(taskById(id)); }
    else if(act==="del"){ deleteTask(id); }
    else if(act==="add"){ openTaskSheet(null); }
    else if(act==="backfill"){ openBackfillSheet(); }
    else if(act==="toggleEdit"){ DB.profile.editMode=!DB.profile.editMode;save();toast(DB.profile.editMode?"编辑已打开 🔓":"编辑已关闭 🔒");render(); }
    else if(act==="redeem"){ redeem(id); }
    else if(act==="padd"){ openPrizeSheet(null); }
    else if(act==="pedit"){ openPrizeSheet(DB.prizes.find(p=>p.id===id)); }
    else if(act==="pdel"){ deletePrize(id); }
    else if(act==="lbonus"){ lifeTap(id,todayStr()); }
    else if(act==="ldeduct"){ lifeTap(id,todayStr()); }
    else if(act==="lbrush"){ lifeTap(id,todayStr(),b.dataset.sub); }
    else if(act==="ledit"){ openLifeSheet(lifeItemById(id)); }
    else if(act==="ldel"){ deleteLifeItem(id); }
    else if(act==="ladd"){ openLifeSheet(null); }
    else if(act==="unredeem"){ undoRedeem(); }
  };
}

function redeem(id){
  const p=DB.prizes.find(x=>x.id===id);if(!p)return;
  const ds=todayStr();
  const balance=nStars(DB.stars.earned-DB.stars.spent);
  if(balance<p.cost){toast("星星还不够哦，再攒一攒吧 ⭐");return;}
  /* 同一种奖励，一天只能兑换一次 */
  const sameToday=DB.redeemed.filter(r=>r.date===ds&&r.prizeId===p.id).length;
  if(sameToday>=1){ toast("今天已经换过这个啦，明天再来～"); return; }
  /* 一天最多兑换 3 个不同奖励 */
  const distinctToday=new Set(DB.redeemed.filter(r=>r.date===ds).map(r=>r.prizeId));
  if(distinctToday.size>=3){ toast("今天已经换3个啦，明天再来～"); return; }
  DB.stars.spent=nStars(DB.stars.spent+p.cost);
  DB.redeemed.push({id:uid(),prizeId:p.id,name:p.name,icon:p.icon,cost:p.cost,date:ds});
  save();
  fx.confetti(window.innerWidth/2,window.innerHeight*0.45,30);
  fx.pop("🎉 兑换成功！",p.icon+" "+p.name+"   -"+starTxt(p.cost)+"⭐");
  render();
}

        else if(sk) btn='<button class="btn sm" data-bf="'+t.id+'">🌊 已跳过，点此补上 +'+starTxt(st)+'⭐</button>';

        return '<div class="task" style="padding:11px"><div class="t-head"><div class="emo" style="width:48px;height:48px;font-size:25px;background:#EAF6FE">'+(t.icon||"⭐")+'</div>'+
          '<div class="nm" style="font-size:16px"><span class="txt">'+esc(t.name)+'</span></div></div>'+
          '<div class="meta" style="margin-top:6px">'+((v>=0.999)?'<span class="chip done">✅ 已做</span>':sk?'<span class="chip skip">🌊 跳过</span>':'<span class="chip">⏳ 未做</span>')+'</div>'+
          '<div class="t-btns" style="margin-top:8px">'+btn+'</div></div>';
      }).join("")+'</div>';
    box.querySelectorAll("[data-bf]").forEach(function(b){ b.onclick=function(){
      const tid=b.dataset.bf, t=taskById(tid), st=(t&&t.star)||1;

  '<div class="field"><label>完成奖励（颗星）</label><input type="number" id="f_star" value="'+(d.star||1)+'" min="1" max="20" step="1"><div class="hint" style="margin-top:7px">打卡一次奖励几颗星。生活习惯类任务可以设 2。</div></div>'+
  '<div class="field" id="f_needWrap" style="'+(isDay?"display:none":"")+'"><label>本周目标次数（做满就自动放假）</label><input type="number" id="f_need" value="'+(d.weeklyNeed||d.days.length||1)+'" min="1" max="7" step="1"></div>'+
  '<div class="rowbtns" style="margin-top:4px">'+
    '<button class="btn" id="f_save" style="flex:1">💾 保存</button>'+
    '<button class="btn ghost" id="f_cancel">取消</button>'+
  '</div>';
  inner.querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>{draft.sub=b.dataset.sub;paintTaskSheet();});
  inner.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{
    draft.u=b.dataset.u;
    if(draft.u==="day") draft.days=[1,2,3,4,5,6,7];
    paintTaskSheet();
  });
  inner.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{
    const n=+b.dataset.d, i=draft.days.indexOf(n);
    if(i>=0){ if(draft.days.length>1) draft.days.splice(i,1); }
    else draft.days.push(n);
    draft.days.sort((a,b2)=>a-b2);
    if(draft.u==="week") draft.weeklyNeed=Math.max(1,Math.min(7,draft.days.length));
    paintTaskSheet();
  });
  inner.querySelector("#f_save").onclick=()=>{
    const name=inner.querySelector("#f_name").value.trim();
    if(!name){toast("给任务起个名字吧 ✍️");return;}
    draft.name=name;
    draft.icon=(inner.querySelector("#f_icon").value.trim()||SUB[draft.sub].e);
    const dur=Math.max(1,Math.min(180,parseInt(inner.querySelector("#f_dur").value,10)||10));
    draft.dur=dur;
    draft.star=Math.max(1,Math.min(20,parseInt(inner.querySelector("#f_star").value,10)||1));
    if(draft.u==="day"){ draft.days=[1,2,3,4,5,6,7]; draft.weeklyNeed=7; }

      let n=needEl?parseInt(needEl.value,10):draft.days.length;
      if(!n||n<1)n=Math.max(1,draft.days.length);
      draft.weeklyNeed=Math.max(1,Math.min(7,n));
    }
    if(draft.id){
      const i=DB.tasks.findIndex(t=>t.id===draft.id);
      if(i>=0) DB.tasks[i]=Object.assign({},DB.tasks[i],draft);
    }else{
      draft.id="t_"+uid();
      DB.tasks.push(draft);
    }
    save();closeSheet();toast("已保存「"+draft.name+"」✅");render();
  };
  inner.querySelector("#f_cancel").onclick=closeSheet;
}

/* ---------- 弹层控制 ---------- */
function openSheet(){document.getElementById("sheet").classList.add("on");}
function closeSheet(){document.getElementById("sheet").classList.remove("on");}
document.getElementById("sheet").onclick=e=>{if(e.target.id==="sheet")closeSheet();};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();});

/* ==================== 进岛门槛（确认学校作业是否完成） ==================== */
function gateBonus(){ const n=parseInt(DB.profile.gateBonus,10); return (n>0&&n<=20)?n:3; }
function gateAskQ(){ return DB.profile.gateAsk||"润衣，学校作业完成了吗？"; }
function gateSkipTip(){ return DB.profile.gateSkipTip||"⚠️ 学校作业还没完成哦，记得先写作业～"; }

/* 今天是否已经通过门槛领过星 */
function gatePassedToday(){
  const ds=todayStr();
  return !!(DB.gatePass && DB.gatePass[ds]);
}
/* 主界面是否允许操作 */
function islandUnlocked(){ return gatePassedToday(); }
/* 某区间内通过门槛（并领了星）的日期列表 */
function gatePassDates(from,to){
  const out=[];
  Object.keys(DB.gatePass||{}).forEach(function(d){
    if(d>=from && d<=to && DB.gatePass[d] && DB.gatePass[d].bonus) out.push(d);
  });
  return out.sort();
}

function openGate(){document.getElementById("gate").classList.add("on");}
function closeGate(){
  document.getElementById("gate").classList.remove("on");
  /* 兜底：门槛一旦关闭，若今天已通过就绝不允许主界面还是模糊的 */
  if(gateOn() && islandUnlocked()){ hideLockedScreen(); unlockIsland(); }
}

/* 开屏唯一弹窗：直接问学校作业完成了吗 */
function paintGate(){
  const box=document.getElementById("gateBox");
  const passed=gatePassedToday();
  if(passed){ paintGatePassed(gateBonus(),false, !!(DB.gatePass[todayStr()]&&DB.gatePass[todayStr()].skip)); return; }
  box.innerHTML=
    '<div class="glow"></div>'+
    '<span class="mascot">🐧</span>'+
    '<h2>'+esc(gateAskQ())+'</h2>'+
    '<button class="bigbtn yes" id="g_yes">✅ 完成啦！</button>'+
    '<button class="bigbtn skip" id="g_skip">📝 还没完成</button>'+
    '<div class="gatefoot">点「完成啦」领 <b>'+gateBonus()+'</b> ⭐ 进岛；点「还没完成」也能进岛，记得先写作业哦～</div>';
  box.querySelector("#g_yes").onclick=gateYes;
  box.querySelector("#g_skip").onclick=gateSkip;
}

/* 「还没完成」现在直接进岛（见 gateSkip），不再单独锁屏 */

/* 点「今天没作业」→ 不领星，直接放行进岛（早读日等没有作业的场景） */
function gateSkip(){
  const ds=todayStr();
  if(!DB.gatePass[ds]) DB.gatePass[ds]={skip:true,ts:Date.now()};
  save();
  hideLockedScreen();
  unlockIsland();
  closeGate();
  toast("好～今天没作业，直接进岛吧 🌤️");
  render();
}

/* 点「完成啦」→ 放行 + 发星（当天只发一次） */
function gateYes(){
  const ds=todayStr();
  let got=gateBonus();
  const first=!DB.gatePass[ds];
  if(first){
    DB.gatePass[ds]={bonus:true, ts:Date.now()};
    DB.stars.earned=nStars(DB.stars.earned+gateBonus());
  }else{ got=0; }
  save();
  hideLockedScreen();
  paintGatePassed(got,true);
  render();
  if(got>0){
    fx.confetti(window.innerWidth/2,window.innerHeight*0.4,34);
    fx.pop("学校作业完成，奖励 "+got+" 颗星！","⭐ 星星飞进口袋啦");
  }
}

/* 通过门槛后的庆祝页 */
function paintGatePassed(got,live,skip){
  const ds=todayStr(), name=DB.profile.child||"润衣";
  const balance=nStars(DB.stars.earned-DB.stars.spent);
  document.getElementById("gateBox").innerHTML=
    '<div class="glow"></div>'+
    '<span class="mascot">🎉</span>'+
    '<h2>'+esc(name)+'，可以进岛啦！</h2>'+
    '<p class="ask small">'+(skip?"今天没有作业，直接开始冒险吧 🌤️":"学校作业完成，真是个守信用的小船长 🌊")+'</p>'+
    (got>0?'<div class="reward">⭐ +'+got+' 颗星星</div>'
          :'<div class="note">今天的奖励星星已经领过啦～明天再来 💙</div>')+
    '<div class="note">现在一共有 <b style="color:#C77700;font-size:17px">'+starTxt(balance)+'</b> 颗星星 🎁</div>'+
    '<button class="bigbtn yes" id="g_enter">🚀 进入冒险岛</button>';
  document.getElementById("gateBox").querySelector("#g_enter").onclick=()=>{
    hideLockedScreen();
    unlockIsland();          /* 关键：务必解除主界面模糊/屏蔽 */
    closeGate();
    fx.confetti(window.innerWidth/2,window.innerHeight*0.35,26);
    if(live) fx.pop("欢迎回来，小船长！","今天的冒险开始啦 ⭐");
  };
}

/* 主界面锁定提示页（点「我先去写作业」后） */
function showLockedScreen(){
  if(!islandUnlocked()) document.getElementById("locked").classList.add("on");
}
function hideLockedScreen(){
  document.getElementById("locked").classList.remove("on");
}

/* ---------- 家长可改门槛文案与奖励 ---------- */
function openGateCfg(){
  const inner=document.getElementById("sheetInner");
  inner.innerHTML='<h3>🚪 进岛门槛设置</h3>'+
    '<div class="hint" style="margin-bottom:12px">打开工具先弹一个窗问「学校作业完成了吗」。点「完成啦」领星进岛；点「还没完成」也能进岛（不领星，横幅会提醒先写作业）。</div>'+
    '<div class="field"><label>门槛问题（弹窗标题）</label><input type="text" id="g_ask" value="'+esc(gateAskQ())+'"></div>'+
    '<div class="field"><label>通过门槛奖励星星数</label><input type="number" id="g_bonus" value="'+gateBonus()+'" min="1" max="20" step="1">'+
      '<div class="hint" style="margin-top:7px">默认 3。当天只能领一次。</div></div>'+
    '<div class="field"><label>点「还没完成」后横幅提醒文字</label><input type="text" id="g_skiptip" value="'+esc(gateSkipTip())+'"></div>'+
    '<div class="field"><label>门槛是否生效</label><div class="rowbtns">'+
      '<button class="btn sm'+(gateOn()?"":" ghost")+'" id="g_switch">'+(gateOn()?"🔛 门槛已开启":"⏸ 门槛已关闭")+'</button>'+
      '<button class="btn sm ghost" id="g_reset">🔄 重置今日门槛</button>'+
    '</div><div class="hint" style="margin-top:8px">关掉门槛＝打开就直接进岛，不弹窗（适合假期）。</div></div>'+
    '<button class="btn wide" id="g_done">✅ 完成</button>';
  inner.querySelector("#g_ask").oninput=function(e){ DB.profile.gateAsk=e.target.value; save(); };
  inner.querySelector("#g_skiptip").oninput=function(e){ DB.profile.gateSkipTip=e.target.value; save(); };
  inner.querySelector("#g_bonus").oninput=function(e){
    const n=parseInt(e.target.value,10); if(n>0&&n<=20) DB.profile.gateBonus=n; else delete DB.profile.gateBonus;
    save();
  };
  inner.querySelector("#g_switch").onclick=function(){
    DB.profile.gateEnabled=!gateOn(); save(); openGateCfg(); toast(gateOn()?"门槛已开启 🔛":"门槛已关闭 ⏸");
  };
  inner.querySelector("#g_reset").onclick=function(){
    const ds=todayStr();
    if(!DB.gatePass[ds]){ toast("今天还没通过门槛，不用重置"); return; }
    if(!confirm("重置今日门槛？孩子下次打开会重新看到弹窗（已发的星星不收回）。")) return;
    delete DB.gatePass[ds]; save();
    closeSheet(); refreshGateState(); toast("已重置今日门槛 🔄");
  };
  inner.querySelector("#g_done").onclick=function(){ closeSheet(); refreshGateState(); };
  openSheet();
}
function gateOn(){
  if(DB.profile.gateEnabled===false) return false;
  return true;
}

/* 根据门槛状态刷新主界面遮罩 */
function refreshGateState(){
  if(!gateOn()){ hideLockedScreen(); closeGate(); unlockIsland(); return; }
  if(islandUnlocked()){ hideLockedScreen(); closeGate(); unlockIsland(); }
  else { lockIsland(); paintGate(); openGate(); }
}
/* 主界面锁定/解锁（模糊 + 不可点） */
function lockIsland(){
  const w=document.getElementById("wrap");
  if(w) w.classList.add("blurred");
  document.body.classList.add("locked");
}
function unlockIsland(){
  const w=document.getElementById("wrap");
  if(w) w.classList.remove("blurred");
  document.body.classList.remove("locked");
}
/* ==================== 启动 ==================== */
(async function init(){
  setSync("loading");
  try{
    DB=await cloudLoad();
    setSync(_dirty?"error":"ok");
  }catch(e){
    console.error("云端加载失败：",e);
    const m=safeLocalGet();
    DB=m?normalizeDB(m):(function(){const b=blankDB();migrateDB(b);return b;})();
    setSync("error");
    toast("⚠️ 云端暂不可用，已用本机数据打开（联网后会自动同步）");
  }
  const d=todayStr();
  if(DB.dailyDate!==d){ DB.dailyDate=d; save(); }
  if(_lifeDirty){ ensureLifeDefaults(DB); save(); _lifeDirty=false; }
  if(!DB.gatePass || typeof DB.gatePass!=="object") DB.gatePass={};
  render();

  /* 主界面绑定「我写完啦」按钮 */
  const lk=document.getElementById("lk_reopen");
  if(lk) lk.onclick=function(){ hideLockedScreen(); paintGate(); openGate(); };

  /* 进岛门槛：每次打开先弹欢迎层；没通过就模糊遮住主界面 */
  if(gateOn()){
    if(islandUnlocked()){ unlockIsland(); closeGate(); }
    else { lockIsland(); setTimeout(function(){ paintGate(); openGate(); },380); }
  }else{
    unlockIsland(); closeGate();
    if(!localStorage.getItem(LS+"_welcome")){
      try{localStorage.setItem(LS+"_welcome","1");}catch(e){}
      setTimeout(function(){
        fx.pop("欢迎来到润衣冒险岛！","点一下 ⭐ 就能打卡啦");
        fx.confetti(window.innerWidth/2,window.innerHeight*0.35,26);
      },520);
    }
  }
  /* 允许外部（设置页）重新评估门槛 */
  window.__refreshGate=refreshGateState;

  /* 打卡后若今天全做完，发全勤奖励 */
  window.__afterCheck=function(){
    const t=todayStr();
    if(!todayAllDone(t)) return;
    if(DB.bonus && DB.bonus[t]) return;
    DB.bonus[t]=true;
    DB.stars.earned=nStars(DB.stars.earned+3);
    save(); render();
    setTimeout(function(){ fx.pop("🎖️ 今日全勤达成！","奖励 +3 颗星"); fx.confetti(window.innerWidth/2,window.innerHeight*0.35,30); },600);
  };

  /* 联网后自动重试失败的同步 */
  window.addEventListener("online",function(){ if(_dirty&&sb) syncAll(DB); });
  setInterval(function(){ if(_dirty&&sb&&!_syncing) syncAll(DB); },30000);
})();
</script>
